<!DOCTYPE html>
<html lang="sw" class="dark h-full bg-gray-950 text-gray-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MtaaX — Admin Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 max-w-lg mx-auto">

  <div id="loginSection" class="bg-gray-900 border border-gray-800 p-6 rounded-2xl text-center space-y-4 my-12">
    <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl">
      <i class="ph ph-shield-check"></i>
    </div>
    <h2 class="text-lg font-bold">MtaaX Admin Panel</h2>
    <input type="password" id="pinInput" placeholder="Weka Admin PIN" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-center text-sm text-white focus:outline-none">
    <button onclick="loginAdmin()" class="w-full bg-emerald-500 text-gray-950 font-bold py-3 rounded-xl text-xs hover:bg-emerald-400">Ingia Panel</button>
  </div>

  <div id="adminContent" class="hidden space-y-6">
    <div class="flex items-center justify-between border-b border-gray-800 pb-3">
      <h1 class="text-base font-bold flex items-center gap-2 text-emerald-400">
        <i class="ph ph-sliders"></i> MtaaX System Control
      </h1>
      <button onclick="logoutAdmin()" class="text-xs bg-rose-950 text-rose-300 px-3 py-1 rounded-lg">Out</button>
    </div>

    <!-- Live Analytics Dashboard Cards -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl text-center">
        <p class="text-[10px] text-gray-400">Total Devices</p>
        <p id="statDevices" class="text-lg font-black text-emerald-400">0</p>
      </div>
      <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl text-center">
        <p class="text-[10px] text-gray-400">Active Ads</p>
        <p id="statAds" class="text-lg font-black text-emerald-400">0</p>
      </div>
      <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl text-center">
        <p class="text-[10px] text-gray-400">Verified Stores</p>
        <p id="statVerified" class="text-lg font-black text-emerald-400">0</p>
      </div>
    </div>

    <div class="space-y-3">
      <h3 class="text-xs font-bold text-gray-400 uppercase">Wauzaji na Status ya Verified Badge</h3>
      <div id="sellersList" class="space-y-2"></div>
    </div>
  </div>

  <script>
    const ADMIN_PIN = 'mtaax123';

    function loginAdmin() {
      const pin = document.getElementById('pinInput').value;
      if (pin === ADMIN_PIN) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
        loadAdminData();
      } else { alert('PIN sio sahihi!'); }
    }

    function logoutAdmin() {
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('adminContent').classList.add('hidden');
    }

    function loadAdminData() {
      const localProducts = JSON.parse(localStorage.getItem('mtaax_local_products') || '[]');
      const verifiedSellers = JSON.parse(localStorage.getItem('mtaax_verified_sellers') || '[]');

      document.getElementById('statAds').textContent = localProducts.length;
      document.getElementById('statVerified').textContent = verifiedSellers.length;
      document.getElementById('statDevices').textContent = new Set(localProducts.map(p => p.deviceKey)).size || 1;

      const sellers = [...new Set(localProducts.map(p => p.seller))];
      let html = '';

      sellers.forEach(seller => {
        const isVer = verifiedSellers.includes(seller);
        html += `
          <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl flex items-center justify-between">
            <span class="text-xs font-bold text-white">${seller}</span>
            <button onclick="toggleVerify('${seller}')" class="text-[10px] font-bold px-3 py-1.5 rounded-lg ${isVer ? 'bg-rose-950 text-rose-300' : 'bg-emerald-950 text-emerald-300'}">
              ${isVer ? 'Ondoa Verified' : 'Weka Verified 🌟'}
            </button>
          </div>
        `;
      });

      document.getElementById('sellersList').innerHTML = html || `<p class="text-xs text-gray-500">Hakuna wauzaji bado.</p>`;
    }

    function toggleVerify(seller) {
      let verified = JSON.parse(localStorage.getItem('mtaax_verified_sellers') || '[]');
      const idx = verified.indexOf(seller);
      if (idx >= 0) verified.splice(idx, 1);
      else verified.push(seller);

      localStorage.setItem('mtaax_verified_sellers', JSON.stringify(verified));
      loadAdminData();
    }
  </script>
</body>
</html>
